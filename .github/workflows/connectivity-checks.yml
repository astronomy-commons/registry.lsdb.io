# This workflow will run daily on weekdays at 07:45.
# It tries to connect to every active resource in the registry,
# reports whether it is reachable and how long it takes to load.

name: Connectivity Check

on:
  schedule:
    - cron: 45 7 * * 1-5
  workflow_dispatch:

jobs:
  check-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - name: Install dependencies
        run: |
          uv pip install --system .
      - name: List dependencies
        run: |
          pip list
      - name: Check resources - LOOK HERE FOR REPORT
        run: |
          python scripts/check_resources.py

  notify:
    needs: check-resources
    if: ${{ failure() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send status to Slack app
        id: slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          # For posting a rich message using Block Kit
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":${{ needs.check-resources.result }}: *${{ github.repository }}:* nightly connectivity check (<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_number }}>)"
                  }
                }
              ]
            }
